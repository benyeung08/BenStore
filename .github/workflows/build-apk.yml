name: Build APK

# 每次 push / PR 的例行建置：只產出 APK 當作 Artifact，不發布。
# 要發正式版本請用另一個 workflow：Actions → Release → Run workflow。
on:
  # 倉庫同時存在 main 與 master，只監聽其中一個會讓另一個分支的 push 完全不觸發
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # compileSdk = 34，但 runner 映像檔預裝的 SDK 版本會隨時間變動，
      # 不保證還有 android-34 / 對應的 build-tools。明確裝一次才不會
      # 出現 "Failed to find Platform SDK with path: platforms/android-34"。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 platform & build-tools
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | grep -E "android-34|34\.0\.0" || true

      - name: Set up Gradle 8.7
        run: |
          set -e
          # --fail 讓 4xx/5xx 直接失敗，否則會把錯誤頁當成 zip 丟給 unzip
          curl --fail --retry 3 -sSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -tq /tmp/gradle.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version

      # 必須在 Build 之前：Gradle 會讀這些環境變數直接簽名
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KS_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            echo "KS_ALIAS=${KEYSTORE_ALIAS:-benstore}" >> "$GITHUB_ENV"
            echo "KS_STORE_PASS=${KEYSTORE_STORE_PASSWORD:-android}" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=${KEYSTORE_KEY_PASSWORD:-android}" >> "$GITHUB_ENV"
            echo "::notice::使用倉庫 secret 中的簽名金鑰"
          else
            echo "::warning::未設定 KEYSTORE_BASE64，改用 CI 自動產生的測試金鑰（每次不同，無法覆蓋升級）"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -alias benstore -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android \
              -dname "CN=BenStore, O=OpenSource, C=HK"
            echo "KS_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            echo "KS_ALIAS=benstore" >> "$GITHUB_ENV"
            echo "KS_STORE_PASS=android" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=android" >> "$GITHUB_ENV"
          fi
          ls -l "$RUNNER_TEMP/keystore.jks"

      # 登入相關設定經環境變數注入，由 app/build.gradle.kts 的 sec() 讀取。
      # 沒設這些 secret 也能編，只是登入功能停用（App 顯示設定提示，不會崩潰）。
      - name: Build Debug + Release
        env:
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LICENSE_PUBKEY: ${{ secrets.LICENSE_PUBKEY }}
        run: |
          set -e
          # 統一用上一步裝好的 Gradle 8.7，不要呼叫專案根目錄那個轉發腳本：
          # 專案裡沒有 gradle-wrapper.jar，該腳本不是真正的 Wrapper，
          # 舊版還會優先讀 $GRADLE_HOME。若 runner 剛好把 GRADLE_HOME 指向
          # 預裝的舊版 Gradle，AGP 8.5.2 會直接編不過，而且很難從 log 看出原因。
          GRADLE_BIN="$(command -v gradle)"
          echo "使用: $GRADLE_BIN ($("$GRADLE_BIN" --version | grep '^Gradle '))"
          echo "WEB_CLIENT_ID 已設定: $([ -n "$WEB_CLIENT_ID" ] && echo 是 || echo 否)"
          "$GRADLE_BIN" assembleDebug assembleRelease --no-daemon --stacktrace

      # 檔名會依「有沒有簽名」而不同，所以自動偵測，不寫死。
      - name: Locate built APKs
        id: locate
        run: |
          set -e
          echo "===== app/build/outputs/apk 實際內容 ====="
          find app/build/outputs/apk -type f 2>/dev/null | sort
          echo "=========================================="

          REL_DIR=app/build/outputs/apk/release
          DBG_DIR=app/build/outputs/apk/debug

          REL=""
          for cand in app-release.apk app-release-unsigned.apk; do
            [ -f "$REL_DIR/$cand" ] && { REL="$REL_DIR/$cand"; break; }
          done
          if [ -z "$REL" ]; then
            REL=$(find "$REL_DIR" -maxdepth 1 -name '*.apk' ! -name '*-signed.apk' 2>/dev/null | sort | head -1)
          fi
          if [ -z "$REL" ]; then
            echo "::error::release 目錄裡找不到 APK，傾整棵樹做診斷"
            find . -name '*.apk' -type f 2>/dev/null | sort | head -50
            echo "release 目錄清單："; ls -la "$REL_DIR" 2>/dev/null || echo "(不存在)"
            exit 1
          fi

          DBG=""
          [ -f "$DBG_DIR/app-debug.apk" ] && DBG="$DBG_DIR/app-debug.apk"
          [ -z "$DBG" ] && DBG=$(find "$DBG_DIR" -maxdepth 1 -name '*.apk' 2>/dev/null | sort | head -1)

          echo "release_apk=$REL" >> "$GITHUB_OUTPUT"
          echo "debug_apk=$DBG"   >> "$GITHUB_OUTPUT"
          echo "release APK => $REL"
          echo "debug   APK => ${DBG:-(無)}"

      - name: Sign & verify release APK
        env:
          REL: ${{ steps.locate.outputs.release_apk }}
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "SDK=$SDK"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，請確認 build-tools 已安裝"
            ls -la "$SDK/build-tools" 2>/dev/null || true
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          OUT=app/build/outputs/apk/release/benstore-release-signed.apk
          # Gradle 已簽名的話這裡會再簽一次，金鑰相同，結果一樣可用
          "$APKSIGNER" sign --ks "$KS_FILE" --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_STORE_PASS" --key-pass "pass:$KS_KEY_PASS" \
            --out "$OUT" "$REL"
          "$APKSIGNER" verify --print-certs "$OUT"

      - name: Collect APKs
        env:
          DBG: ${{ steps.locate.outputs.debug_apk }}
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/release/benstore-release-signed.apk dist/benstore-release.apk
          if [ -n "$DBG" ] && [ -f "$DBG" ]; then
            cp "$DBG" dist/benstore-debug.apk
          fi
          cd dist && sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: benstore-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 30
