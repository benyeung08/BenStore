name: Release

# 全程在 GitHub 網頁操作：Actions → Release → Run workflow → 填版本號 → 完成。
# 不需要本機 git tag、不需要 Android Studio、不需要打任何指令。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本標籤 / Release tag（請帶 v，例如 v1.0.1）'
        required: true
        # 原本預設 v1.0.0，但 build.gradle.kts 已是 1.0.1，
        # 直接按預設值發版會把 versionName 倒退成 1.0.0，
        # 而且會套用宣稱「公開模式免登入」的舊說明檔（與強制登入的 APK 矛盾）。
        default: 'v1.0.1'
      prerelease:
        description: '標記為預發布 / Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Bump → Build → Sign → Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # compileSdk = 34，runner 預裝 SDK 會變動，明確安裝避免找不到 android-34
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 platform & build-tools
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | grep -E "android-34|34\.0\.0" || true

      - name: Set up Gradle 8.7
        run: |
          set -e
          curl --fail --retry 3 -sSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -tq /tmp/gradle.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version

      # ---------- 1. 版本號同步到 build.gradle.kts ----------
      - name: Bump version
        id: bump
        env:
          TAG: ${{ inputs.tag }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          set -e
          # tag 會被 sed 直接寫進 build.gradle.kts 的字串，也會拿去找
          # RELEASE_NOTES_<tag>.md。含空格 / 引號 / shell 中繼字元會讓
          # Kotlin DSL 語法壞掉或注入指令，所以先嚴格校驗。
          if ! printf '%s' "$TAG" | grep -qE '^v?[0-9]+(\.[0-9]+)*(-[A-Za-z0-9._-]+)?$'; then
            echo "::error::tag 格式不對：$TAG（範例：v1.0.1、v1.1.0-beta.1）"
            exit 1
          fi
          ver="${TAG#v}"
          file=app/build.gradle.kts
          # 直接用 run_number 當 versionCode 有風險：若倉庫是從別處匯入、
          # run_number 從 1 重新開始，會比已發布的版本還小，使用者無法覆蓋安裝。
          # 改成「目前值 + 1」與 run_number 取較大者，保證單調遞增。
          CUR=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' "$file" | head -1)
          CUR=${CUR:-0}
          NEW=$((CUR + 1))
          if [ "$RUN_NUM" -gt "$NEW" ]; then NEW=$RUN_NUM; fi
          sed -i "s/versionCode = [0-9]*/versionCode = ${NEW}/" "$file"
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${ver}\"/" "$file"
          echo "已設定 versionName=${ver} versionCode=${NEW}（原 ${CUR}，run ${RUN_NUM}）"
          grep -n "versionName\|versionCode" "$file"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app/build.gradle.kts
            git commit -m "chore: bump version to ${TAG}"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "版本號沒有變動，略過 commit"
          fi

      # ---------- 2. 簽名金鑰（必須在編譯之前，Gradle 會直接讀環境變數簽名）----------
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KS_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            echo "KS_ALIAS=${KEYSTORE_ALIAS:-benstore}" >> "$GITHUB_ENV"
            echo "KS_STORE_PASS=${KEYSTORE_STORE_PASSWORD:-android}" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=${KEYSTORE_KEY_PASSWORD:-android}" >> "$GITHUB_ENV"
            echo "::notice::使用倉庫 secret 中的簽名金鑰"
          else
            echo "::warning::未設定 KEYSTORE_BASE64，改用 CI 自動產生的測試金鑰（每次不同，無法覆蓋升級）"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -alias benstore -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android \
              -dname "CN=BenStore, O=OpenSource, C=HK"
            echo "KS_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            echo "KS_ALIAS=benstore" >> "$GITHUB_ENV"
            echo "KS_STORE_PASS=android" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=android" >> "$GITHUB_ENV"
          fi

      # ---------- 3. 編譯 ----------
      # 登入相關設定經環境變數注入，由 app/build.gradle.kts 的 sec() 讀取。
      # 沒設這些 secret 也能編，只是登入功能停用（App 顯示設定提示，不會崩潰）。
      - name: Build Debug + Release
        env:
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LICENSE_PUBKEY: ${{ secrets.LICENSE_PUBKEY }}
        run: |
          set -e
          # 統一用 Gradle 8.7；理由同 build-apk.yml（gradlew 無 wrapper jar，
          # 會受 runner 的 $GRADLE_HOME 影響而用到不相容的舊版）。
          GRADLE_BIN="$(command -v gradle)"
          echo "使用: $GRADLE_BIN ($("$GRADLE_BIN" --version | grep '^Gradle '))"
          echo "WEB_CLIENT_ID 已設定: $([ -n "$WEB_CLIENT_ID" ] && echo 是 || echo 否)"
          "$GRADLE_BIN" assembleDebug assembleRelease --no-daemon --stacktrace

      # 檔名會依「有沒有簽名」而不同（app-release.apk / app-release-unsigned.apk），
      # 所以自動偵測，不寫死。
      - name: Locate built APKs
        id: locate
        run: |
          set -e
          echo "===== app/build/outputs/apk 實際內容 ====="
          find app/build/outputs/apk -type f 2>/dev/null | sort
          echo "=========================================="

          REL_DIR=app/build/outputs/apk/release
          DBG_DIR=app/build/outputs/apk/debug

          REL=""
          for cand in app-release.apk app-release-unsigned.apk; do
            if [ -f "$REL_DIR/$cand" ]; then REL="$REL_DIR/$cand"; break; fi
          done
          if [ -z "$REL" ]; then
            REL=$(find "$REL_DIR" -maxdepth 1 -name '*.apk' ! -name '*-signed.apk' | sort | head -1)
          fi
          if [ -z "$REL" ]; then
            echo "::error::release 目錄裡找不到 APK，傾整棵樹做診斷"
            find . -name '*.apk' -type f 2>/dev/null | sort | head -50
            echo "release 目錄清單："; ls -la "$REL_DIR" 2>/dev/null || echo "(不存在)"
            exit 1
          fi

          DBG=""
          for cand in app-debug.apk; do
            if [ -f "$DBG_DIR/$cand" ]; then DBG="$DBG_DIR/$cand"; break; fi
          done
          if [ -z "$DBG" ]; then
            DBG=$(find "$DBG_DIR" -maxdepth 1 -name '*.apk' | sort | head -1)
          fi

          echo "release_apk=$REL" >> "$GITHUB_OUTPUT"
          echo "debug_apk=$DBG"   >> "$GITHUB_OUTPUT"
          echo "release APK => $REL"
          echo "debug   APK => ${DBG:-(無)}"

      - name: Sign & verify release APK
        env:
          REL: ${{ steps.locate.outputs.release_apk }}
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "SDK=$SDK"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，請確認 build-tools 已安裝"
            ls -la "$SDK/build-tools" 2>/dev/null || true
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          OUT=app/build/outputs/apk/release/benstore-release-signed.apk
          "$APKSIGNER" sign --ks "$KS_FILE" --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_STORE_PASS" --key-pass "pass:$KS_KEY_PASS" \
            --out "$OUT" "$REL"
          "$APKSIGNER" verify --print-certs "$OUT"

      # ---------- 5. 收集產物 + 產生校驗值 ----------
      - name: Collect APKs and checksums
        env:
          DBG: ${{ steps.locate.outputs.debug_apk }}
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/release/benstore-release-signed.apk dist/benstore-release.apk
          if [ -n "$DBG" ] && [ -f "$DBG" ]; then
            cp "$DBG" dist/benstore-debug.apk
          fi
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Build release body
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          body="$RUNNER_TEMP/body.md"
          notes="RELEASE_NOTES_${TAG}.md"
          if [ -f "$notes" ]; then
            cat "$notes" > "$body"
          else
            # 原本降級分支只寫了「以下是 commit 摘要」卻沒真的附上，這裡補實
            {
              echo "# BenStore ${TAG}"
              echo ""
              echo "_（沒有找到 \`${notes}\`，以下為本次發版的 commit 摘要）_"
              echo ""
              echo '```'
              git log -n 20 --pretty=format:'%h %s' 2>/dev/null || true
              echo ""
              echo '```'
            } > "$body"
          fi
          {
            echo ""
            echo "## 校驗值 / Checksums"
            echo ""
            echo "| 檔案 / File | SHA-256 |"
            echo "| --- | --- |"
          } >> "$body"
          while read -r sum file; do
            echo "| \`$file\` | \`$sum\` |" >> "$body"
          done < dist/SHA256SUMS.txt
          {
            echo ""
            echo "驗證 / Verify: \`sha256sum -c SHA256SUMS.txt\`"
          } >> "$body"
          echo "path=$body" >> "$GITHUB_OUTPUT"
        id: body

      # ---------- 6. 建 tag ----------
      - name: Create and push tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 重跑同一個 tag 時，原本只印 warning 不更新 tag，
          # 結果 Release 內容換了、tag 卻仍指向舊的（未 bump 版本的）commit。
          # 改為一律把 tag 指向本次 commit 再 force push。
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::notice::tag $TAG 已存在，將移至本次 commit 並更新該 Release"
          fi
          git tag -f -a "$TAG" -m "BenStore ${TAG}" HEAD
          git push origin -f "$TAG"
          echo "tag $TAG → $(git rev-parse --short HEAD)"

      # ---------- 7. 發布 ----------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: BenStore ${{ inputs.tag }}
          body_path: ${{ steps.body.outputs.path }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          prerelease: ${{ inputs.prerelease }}
          # prerelease 不該被標成 latest，GitHub API 在這個組合會報錯或忽略
          make_latest: ${{ inputs.prerelease == false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
