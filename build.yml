name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 校验
  verify:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 建议版本稳定后锁定，例如：flutter-version: '3.35.1'
      - name: 安装依赖
        run: flutter pub get
      - name: 静态检查
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: 单元测试
        run: flutter test

  # ---------------------------------------------------------------- Android
  android:
    name: android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 生成 Android 壳
        run: flutter create --org com.ben --project-name ben_browser --platforms=android .
      - name: 打补丁（http 明文 / 网络权限）
        run: python3 tool/patch_platform.py
      - run: flutter pub get

      - name: 构建 APK（按 ABI 拆分）
        run: flutter build apk --release --split-per-abi

      # 需要上架 Play 时打开：先在 android/key.properties 与 android/app/keystore.jks
      # 配置签名，并把密钥以 secrets 传入，再启用下面两步生成 AAB。
      # - name: 构建 AAB
      #   run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: benbrowser-android
          path: build/app/outputs/flutter-apk/*.apk

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk

  # ---------------------------------------------------------------- Windows
  windows:
    name: windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 生成 Windows 壳
        run: flutter create --org com.ben --project-name ben_browser --platforms=windows .
      - run: flutter pub get

      - name: 构建 Windows 桌面版
        run: flutter build windows --release

      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath BenBrowser-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: benbrowser-windows
          path: BenBrowser-windows-x64.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BenBrowser-windows-x64.zip

  # ---------------------------------------------------------------- macOS
  macos:
    name: macos
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 生成 macOS 壳
        run: flutter create --org com.ben --project-name ben_browser --platforms=macos .
      - name: 打补丁（网络权限 / 产物名）
        run: python3 tool/patch_platform.py
      - run: flutter pub get

      - name: 构建 macOS 桌面版
        run: flutter build macos --release

      - name: 打包
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          echo "打包产物：$APP"
          zip -r "$GITHUB_WORKSPACE/BenBrowser-macos.zip" "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: benbrowser-macos
          path: BenBrowser-macos.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BenBrowser-macos.zip
